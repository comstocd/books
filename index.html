.stats b{color:var(--fg)}

.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px}
select,.toggle{font-family:var(--display);font-size:.88rem;border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:6px;padding:5px 8px;cursor:pointer}
.toggle{border-radius:999px;padding:4px 11px}
.toggle[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
label.sl{font-family:var(--display);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--display);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
td.t{font-weight:600}
td.loc,td.cat{font-family:var(--display);font-size:.88rem;color:var(--muted);white-space:nowrap}
.flag{display:inline-block;font-family:var(--display);font-size:.72rem;background:var(--flagbg);color:var(--flag);border-radius:4px;padding:0 5px;margin-left:6px;font-weight:500}
.note{display:block;font-weight:400;font-size:.85rem;color:var(--flag)}
.empty{color:var(--muted);padding:24px 4px}
footer{margin-top:28px;color:var(--muted);font-size:.85rem;max-width:65ch}
